<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>The Mystery Gift 🎁</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Dancing+Script:wght@600;700&family=Playfair+Display:wght@700&family=Poppins:wght@500;600&display=swap"
    rel="stylesheet">
  <style>
    /* ===== COLORS: change the palette here ===== */
    :root {
      --pink: #ff9ecb;
      --purple: #a77bff;
      --navy: #0b1030;
      --gold: #ffd36b
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      color: #fff;
      font-family: 'Poppins', system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 30%, #2a1458, #120a38 55%, #070a20)
    }

    #fx {
      position: fixed;
      inset: 0;
      z-index: 9;
      pointer-events: none
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: safe center;
      gap: clamp(10px, 2.4vh, 20px);
      padding: 16px;
      text-align: center;
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      transition: opacity .9s, visibility .9s
    }

    .stage.active {
      opacity: 1;
      visibility: visible
    }

    .stage>:not(.bgl) {
      position: relative;
      z-index: 2
    }

    .bgl {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none
    }

    .ttl {
      font: 700 clamp(26px, 7vw, 44px) 'Playfair Display', serif;
      background: linear-gradient(90deg, #ffe28a, #ffb3d9, #c9a6ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 12px #ffd36b66)
    }

    .cap {
      font: 600 clamp(21px, 5.6vw, 32px) 'Dancing Script', cursive;
      color: #ffe7f3;
      text-shadow: 0 0 14px #ff9ecb99
    }

    .sub {
      max-width: 520px;
      font-size: clamp(14px, 3.6vw, 17px);
      line-height: 1.65;
      color: #f1e6ff
    }

    .btn {
      font: 600 clamp(15px, 4vw, 18px) 'Poppins', sans-serif;
      color: #2b1650;
      padding: 14px 28px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(135deg, #ffe28a, #ffb3d9 60%, #c9a6ff);
      box-shadow: 0 0 22px #ffd36b88, 0 6px 18px #0006;
      animation: pulse 2s ease-in-out infinite;
      transition: transform .2s
    }

    .btn:hover {
      transform: scale(1.05)
    }

    .btn:focus-visible,
    .gift:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px
    }

    .btn:disabled {
      animation: none;
      filter: grayscale(.5) brightness(.8);
      cursor: default;
      transform: none
    }

    .btn.sm {
      font-size: 14px;
      padding: 9px 18px
    }

    @keyframes pulse {
      50% {
        box-shadow: 0 0 38px 8px #ffd36bbb, 0 6px 18px #0006
      }
    }

    .later {
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity .9s, transform .9s
    }

    .later.show {
      opacity: 1;
      pointer-events: auto;
      transform: none
    }

    /* ===== PAGE 1: 3D GIFT BOX ===== */
    .scene {
      width: 260px;
      height: 260px;
      perspective: 900px;
      display: grid;
      place-items: center;
      position: relative;
      transition: opacity 1.2s, transform 1.2s
    }

    .scene.gone {
      opacity: 0;
      transform: scale(.6) translateY(-30px)
    }

    .halo {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 300px;
      height: 300px;
      margin: -150px 0 0 -150px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffe28af2, #ffa0dc66 40%, transparent 70%);
      opacity: 0;
      transform: scale(.3);
      transition: opacity 1s, transform 1.4s
    }

    .halo.on {
      opacity: 1;
      transform: scale(1.3)
    }

    .plat {
      position: absolute;
      bottom: 55px;
      left: 50%;
      width: 230px;
      height: 40px;
      margin-left: -115px;
      border-radius: 50%;
      background: radial-gradient(ellipse, #ffd36b99, #a77bff40 60%, transparent 72%);
      animation: pulse2 3s ease-in-out infinite
    }

    @keyframes pulse2 {
      50% {
        opacity: .55
      }
    }

    .gift {
      position: relative;
      width: 150px;
      height: 110px;
      transform-style: preserve-3d;
      transform: rotateX(-18deg) rotateY(30deg);
      animation: sway 6s ease-in-out infinite;
      cursor: pointer;
      outline: none
    }

    .gift.open {
      animation-play-state: paused
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotateX(-18deg) rotateY(24deg)
      }

      50% {
        transform: rotateX(-18deg) rotateY(38deg) translateY(-8px)
      }
    }

    .body,
    .lid {
      transform-style: preserve-3d
    }

    .body {
      --z: 75px;
      position: absolute;
      inset: 0
    }

    .lid {
      --z: 82px;
      position: absolute;
      left: -7px;
      top: -36px;
      width: 164px;
      height: 36px;
      transform-origin: 50% 100% -82px;
      transition: transform 1.4s cubic-bezier(.3, 1.3, .5, 1)
    }

    .open .lid {
      transform: rotateX(112deg) translateY(-6px)
    }

    .f {
      position: absolute;
      left: 0;
      top: 0;
      background: linear-gradient(115deg, #ffffff59, transparent 40%), linear-gradient(135deg, #ff8fc4, #b57bff)
    }

    .body .f {
      width: 150px;
      height: 110px
    }

    .lid .f {
      width: 164px;
      height: 36px;
      background: linear-gradient(115deg, #ffffff66, transparent 40%), linear-gradient(135deg, #ff9fd0, #9b6bff)
    }

    .f::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 50%;
      width: 26px;
      margin-left: -13px;
      background: linear-gradient(90deg, #c9942b, #ffe08a, #c9942b);
      transition: transform 1s, opacity 1s
    }

    .open .f::before {
      transform: scaleX(.5);
      opacity: .5
    }

    .fF {
      transform: translateZ(var(--z))
    }

    .fB {
      transform: rotateY(180deg) translateZ(var(--z))
    }

    .fR {
      transform: rotateY(90deg) translateZ(var(--z))
    }

    .fL {
      transform: rotateY(-90deg) translateZ(var(--z))
    }

    .body .in {
      height: 150px;
      top: -20px;
      width: 150px;
      transform: rotateX(90deg) translateZ(55px);
      background: radial-gradient(#7a3fd0, #2a1458)
    }

    .body .in::before {
      display: none
    }

    .open .in {
      background: radial-gradient(#fff6c8, #ffd36b 50%, #b8741a);
      transition: background 1s
    }

    .lid .tp {
      width: 164px;
      height: 164px;
      top: -64px;
      transform: rotateX(90deg) translateZ(18px)
    }

    .tp::after {
      content: '';
      position: absolute;
      inset: 50% 0 auto;
      height: 26px;
      margin-top: -13px;
      background: linear-gradient(#c9942b, #ffe08a, #c9942b)
    }

    .bow {
      position: absolute;
      left: 50%;
      top: -44px;
      width: 96px;
      height: 48px;
      margin-left: -48px;
      transition: transform 1.2s, opacity 1.2s
    }

    .open .bow {
      transform: translateY(-26px) rotate(18deg) scale(1.15);
      opacity: 0
    }

    .lp {
      position: absolute;
      top: 2px;
      width: 44px;
      height: 36px;
      border-radius: 50%;
      border: 6px solid #e0aa3a;
      background: radial-gradient(#fff0b0, #ffd36b);
      box-shadow: 0 0 12px #ffd36b99
    }

    .lp.l {
      left: 0;
      transform: rotate(-24deg)
    }

    .lp.r {
      right: 0;
      transform: rotate(24deg)
    }

    .kn {
      position: absolute;
      left: 50%;
      top: 14px;
      width: 20px;
      height: 20px;
      margin-left: -10px;
      border-radius: 50%;
      background: radial-gradient(#fff6c8, #e0aa3a)
    }

    /* ===== PAGE 2: LAYERED CAKE ===== */
    .cakewrap {
      position: relative;
      width: 240px;
      height: 262px;
      opacity: 0;
      transform: translateY(40px) scale(.85);
      transition: opacity 1.4s, transform 1.4s cubic-bezier(.2, 1.2, .4, 1)
    }

    #s2.active .cakewrap {
      opacity: 1;
      transform: none;
      animation: bob 4s ease-in-out 1.5s infinite
    }

    @keyframes bob {
      50% {
        transform: translateY(-8px)
      }
    }

    .cakewrap::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 0;
      width: 300px;
      height: 300px;
      margin-left: -150px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffb34766, transparent 62%);
      transition: opacity 1s;
      animation: halo2 1.6s ease-in-out infinite alternate
    }

    @keyframes halo2 {
      to {
        opacity: .6
      }
    }

    .cakewrap.blown::before {
      opacity: 0;
      animation: none
    }

    .cake {
      position: absolute;
      inset: 0;
      transform-origin: 50% 100%;
      scale: var(--k, 1);
      transition: filter .6s
    }

    .cakewrap.glow .cake {
      filter: drop-shadow(0 0 26px #ffaadcb3)
    }

    .plate {
      position: absolute;
      left: 4px;
      bottom: 0;
      width: 232px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 35%, #fff, #eadcff 55%, #b79cf0);
      box-shadow: 0 14px 26px #0008, inset 0 -4px 8px #7a5cc055
    }

    .tier {
      position: absolute;
      border-radius: 12px 12px 14px 14px;
      box-shadow: inset 12px 0 16px #ffffff2e, inset -14px 0 18px #0000002e, 0 6px 10px #0004
    }

    .tier::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: -8px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 40%, #fff, var(--fr))
    }

    .tier::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 26px;
      z-index: 2;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(var(--fr), var(--fr)) 0 0/100% 10px no-repeat, radial-gradient(circle at 9px 8px, var(--fr) 9px, transparent 10px) 0 0/26px 20px repeat-x, radial-gradient(ellipse 6px 16px at 50% 6px, var(--fr) 94%, transparent) 0 0/42px 24px repeat-x
    }

    .t1 {
      left: 20px;
      bottom: 16px;
      width: 200px;
      height: 68px;
      background: linear-gradient(#ff9ec4, #ff74a8);
      --fr: #fff4f9;
      --pe: #fff
    }

    .t2 {
      left: 46px;
      bottom: 76px;
      width: 148px;
      height: 56px;
      background: linear-gradient(#fff3cf, #ffd88a);
      --fr: #ffc2dc;
      --pe: #ff8fba
    }

    .t3 {
      left: 72px;
      bottom: 124px;
      width: 96px;
      height: 48px;
      background: linear-gradient(#7d4b3b, #4a2a25);
      --fr: #fff0d9;
      --pe: #ffd36b
    }

    .pearls {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 6px;
      height: 10px;
      background: radial-gradient(circle, var(--pe) 3px, transparent 3.8px) 0 0/16px 10px repeat-x
    }

    .lab {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      z-index: 1;
      transform: translateY(-32%);
      text-align: center;
      font: 600 22px 'Dancing Script', cursive;
      color: #fff;
      text-shadow: 0 1px 4px #b0306099
    }

    .ch {
      position: absolute;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff8a8a, #c4153c);
      box-shadow: 0 2px 4px #0006
    }

    .ch::after {
      content: '';
      position: absolute;
      left: 7px;
      top: -8px;
      width: 2px;
      height: 9px;
      background: #3b7a3b;
      transform: rotate(18deg)
    }

    .sp {
      position: absolute;
      width: 7px;
      height: 2.5px;
      border-radius: 2px
    }

    .candles {
      position: absolute;
      left: 72px;
      bottom: 166px;
      width: 96px;
      height: 70px
    }

    .candle {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 66px
    }

    .candle:nth-child(1) {
      left: 14px
    }

    .candle:nth-child(2) {
      left: 43px
    }

    .candle:nth-child(3) {
      left: 72px
    }

    .stick {
      position: absolute;
      bottom: 0;
      width: 10px;
      height: 48px;
      border-radius: 3px;
      background: repeating-linear-gradient(45deg, #fff 0 5px, #ff9ecb 5px 10px)
    }

    .candle:nth-child(2) .stick {
      background: repeating-linear-gradient(45deg, #fff 0 5px, #ffd36b 5px 10px)
    }

    .candle:nth-child(3) .stick {
      background: repeating-linear-gradient(45deg, #fff 0 5px, #b99aff 5px 10px)
    }

    .stick::before {
      content: '';
      position: absolute;
      left: 4px;
      top: -6px;
      width: 2px;
      height: 6px;
      background: #333
    }

    .flame {
      position: absolute;
      left: -1px;
      bottom: 54px;
      width: 12px;
      height: 19px;
      border-radius: 50% 50% 50% 50%/62% 62% 38% 38%;
      background: radial-gradient(#fff, #ffd36b 50%, #ff8a3d);
      box-shadow: 0 0 18px 7px #ffb34766;
      transform-origin: 50% 100%;
      animation: flick .15s ease-in-out infinite alternate
    }

    .candle:nth-child(2) .flame {
      animation-delay: -.07s
    }

    @keyframes flick {
      to {
        transform: scale(1.08, .94) rotate(3deg)
      }
    }

    .flame.wind {
      animation: wind .9s ease-in-out forwards
    }

    @keyframes wind {
      0% {
        transform: rotate(0)
      }

      30% {
        transform: rotate(-40deg) scaleY(.7)
      }

      55% {
        transform: rotate(28deg) scaleY(.5)
      }

      80% {
        transform: rotate(-30deg) scaleY(.35)
      }

      100% {
        transform: rotate(0) scaleY(.2)
      }
    }

    .flame.out {
      animation: none;
      opacity: 0;
      transform: scale(0);
      transition: .5s
    }

    .smoke {
      position: absolute;
      left: 0;
      bottom: 56px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #dcdcebb3;
      filter: blur(3px);
      opacity: 0;
      animation: smoke 2.2s ease-out forwards
    }

    @keyframes smoke {
      10% {
        opacity: .7
      }

      to {
        opacity: 0;
        transform: translate(var(--x), -120px) scale(3.2)
      }
    }

    .wish {
      font: 600 clamp(24px, 6vw, 34px) 'Dancing Script', cursive;
      color: var(--gold);
      text-shadow: 0 0 16px #ffd36b;
      opacity: 0;
      transform: scale(.5);
      transition: opacity .6s, transform .8s cubic-bezier(.3, 1.8, .5, 1);
      min-height: 1.4em
    }

    .wish.show {
      opacity: 1;
      transform: none
    }

    @media (max-height:700px) {
      .cake {
        --k: .86
      }

      .cakewrap {
        margin-top: -30px
      }
    }

    @media (max-height:580px) {
      .cake {
        --k: .72
      }

      .cakewrap {
        margin-top: -66px
      }
    }

    h2.cap {
      font-size: clamp(24px, 6.4vw, 38px)
    }

    /* ===== PAGE 3: GALAXY ===== */
    #gal {
      width: 100%;
      height: 100%;
      display: block
    }

    .par {
      position: absolute;
      transform: translate3d(calc(var(--px, 0)*var(--d)*1px), calc(var(--py, 0)*var(--d)*1px), 0)
    }

    .neb {
      border-radius: 50%;
      filter: blur(34px);
      opacity: .5;
      animation: drift 20s ease-in-out infinite alternate
    }

    @keyframes drift {
      to {
        transform: translate(30px, -24px) scale(1.15)
      }
    }

    .pl {
      border-radius: 50%
    }

    .planet {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: inset -14px -10px 26px #000a, 0 0 30px var(--c1)
    }

    .planet::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 300%;
      background: repeating-linear-gradient(100deg, var(--c1) 0 15px, var(--c2) 15px 30px);
      animation: spin 14s linear infinite
    }

    @keyframes spin {
      to {
        transform: translateX(-60px)
      }
    }

    .ring {
      position: absolute;
      left: -32%;
      right: -32%;
      top: 38%;
      height: 24%;
      border: 3px solid #ffdc9699;
      border-radius: 50%;
      transform: rotate(-18deg)
    }

    .flash {
      background: radial-gradient(circle at 50% 37%, #fff, #ff96d29a 30%, transparent 65%);
      opacity: 0;
      transition: opacity .5s
    }

    .flash.on {
      opacity: .9
    }

    .gtxt {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto
    }

    #s3 {
      justify-content: flex-end;
      padding-bottom: 5vh
    }

    .gtxt .cap:last-child {
      font-size: clamp(26px, 7vw, 40px);
      color: #fff
    }

    /* ===== PAGE 4: LOVE TREE ===== */
    #s5 {
      padding: 12px 16px;
      gap: clamp(4px, 1.4vh, 12px)
    }

    .garden {
      background: linear-gradient(#050a28, #1a1250 55%, #2d1a60 80%)
    }

    .moon {
      position: absolute;
      right: 8%;
      top: 5%;
      width: clamp(44px, 9vw, 70px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbe8, #ffe9a8);
      box-shadow: 0 0 50px 14px #ffe9a866
    }

    .moon::before {
      content: '';
      position: absolute;
      left: 30%;
      top: 26%;
      width: 22%;
      height: 22%;
      border-radius: 50%;
      background: #e8d68a55
    }

    .moon::after {
      content: '';
      position: absolute;
      left: 58%;
      top: 56%;
      width: 15%;
      height: 15%;
      border-radius: 50%;
      background: #e8d68a44
    }

    .gs {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(1.5px 1.5px at 12% 18%, #fff, transparent), radial-gradient(1.5px 1.5px at 30% 8%, #fff, transparent), radial-gradient(1px 1px at 52% 22%, #fff, transparent), radial-gradient(1.5px 1.5px at 70% 12%, #fff, transparent), radial-gradient(1px 1px at 88% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 20% 40%, #fff, transparent), radial-gradient(1px 1px at 80% 48%, #fff, transparent);
      animation: tw 3.6s ease-in-out infinite alternate
    }

    .gs2 {
      background-image: radial-gradient(1px 1px at 6% 30%, #fff, transparent), radial-gradient(1.5px 1.5px at 24% 24%, #ffe9a8, transparent), radial-gradient(1px 1px at 42% 10%, #fff, transparent), radial-gradient(1.5px 1.5px at 60% 34%, #fff, transparent), radial-gradient(1px 1px at 76% 20%, #ffd7f0, transparent), radial-gradient(1.5px 1.5px at 94% 14%, #fff, transparent), radial-gradient(1px 1px at 40% 46%, #fff, transparent);
      animation-delay: 1.8s
    }

    @keyframes tw {
      from {
        opacity: .35
      }

      to {
        opacity: 1
      }
    }

    .shoot {
      position: absolute;
      top: 14%;
      left: -10%;
      width: 90px;
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, #fff);
      opacity: 0;
      animation: shoot 8s ease-in 3s infinite
    }

    @keyframes shoot {
      0% {
        opacity: 0;
        transform: translate(0, 0) rotate(24deg)
      }

      3% {
        opacity: 1
      }

      12% {
        opacity: 0;
        transform: translate(75vw, 34vw) rotate(24deg)
      }

      100% {
        opacity: 0
      }
    }

    .hill {
      position: absolute;
      bottom: -14vh;
      left: -15%;
      width: 130%;
      height: 34vh;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 0, #1d5c4d, #0d3030 70%)
    }

    .hill.h2 {
      left: -35%;
      width: 95%;
      bottom: -17vh;
      height: 30vh;
      background: radial-gradient(ellipse at 50% 0, #17504a, #0b2a2c 70%)
    }

    #tree {
      width: max(170px, min(92vw, calc((100vh - 310px)*.95), 540px));
      width: max(170px, min(92vw, calc((100dvh - 310px)*.95), 540px));
      height: auto;
      overflow: visible;
      flex: 0 0 auto
    }

    #tree .seedc {
      opacity: 0;
      transform: scale(0);
      transition: .8s;
      transform-box: fill-box;
      transform-origin: center;
      filter: drop-shadow(0 0 4px var(--gold))
    }

    #tree.seed .seedc {
      opacity: 1;
      transform: scale(1)
    }

    #tree.glow .seedc {
      animation: sg 1s ease-in-out infinite
    }

    @keyframes sg {
      50% {
        filter: drop-shadow(0 0 14px #fff2a0)
      }
    }

    #tree .spr {
      opacity: 0;
      transform: scaleY(0);

    const CONFIG = {

    const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
    const RM = matchMedia('(prefers-reduced-motion: reduce)').matches, MOB = innerWidth < 700;
    let run = 0, busy = 0, mode = 'a';
    const D = ms => RM ? ms * .4 : ms;

    function updateBalloonProgress() {$('#balloonProgress').textContent = `${openedBalloons.size} / 10 memories opened`;}
    const PH_RATIO = [.75, 1.33, 1, 1.5, .8, 1.25, .66, 1.1, .9, 1.4], PH_TILT = [-3, 2.5, -1.5, 3, -2.5, 1.5, -3.5, 2, -1, 3.2];
    function showMemory(i) {
      const img = $('#memoryImage'), pol = $('#polaroid'), exts = ['jpg', 'jpeg', 'png', 'webp'], base = CONFIG.photos[i].replace(/\.\w+$/, ''); let k = 0;
      const fit = r => {const bw = r < .9 ? 300 : r > 1.15 ? 430 : 350; pol.style.setProperty('--pw', Math.max(190, Math.min(bw, innerHeight * .5 * r + 36, innerWidth * .88)) + 'px'); img.style.setProperty('--ratio', r)};
      fit(PH_RATIO[i]); img.alt = `Memory ${i + 1}`;
      img.onload = () => fit(img.naturalWidth / img.naturalHeight);
      img.onerror = () => {k++; if (k < exts.length) img.src = `${base}.${exts[k]}`; else {img.onerror = null; img.removeAttribute('src')}};
      img.src = CONFIG.photos[i];
      $('#memoryCaption').textContent = CONFIG.captions[i] || 'A memory to keep forever. ❤️'; $('#memoryCount').textContent = `MEMORY ${String(i + 1).padStart(2, '0')}  ·  ${CONFIG.name.toUpperCase()}`;
      pol.style.setProperty('--tilt', `${PH_TILT[i]}deg`); $('#memoryModal').classList.add('show');
    }
    function closeMemory() {$('#memoryModal').classList.remove('show');}
    $('#closeMemory').onclick = closeMemory; $('#memoryModal').addEventListener('click', e => {if (e.target === $('#memoryModal')) closeMemory()});
    $('#toTree').onclick = safe(async () => {closeMemory(); $('#toTree').disabled = true; await go(5)});
    document.addEventListener('keydown', e => {if (e.key === 'Escape') closeMemory()});

    /* ===== FINAL LETTER: TYPEWRITER + SKIP ===== */
    async function startLetter() {
      const id = ++letterRun, el = $('#letterText'), bd = $('#letterBody'); bd.scrollTop = 0; el.textContent = ''; $('#letterSign').style.opacity = '0'; $('#skipLetter').hidden = false;
      const chars = Array.from(CONFIG.letter); el.classList.add('typing');
      for (let i = 0; i < chars.length; i++) {if (id !== letterRun) return; const stick = bd.scrollHeight - bd.scrollTop - bd.clientHeight < 50; el.textContent += chars[i]; if (stick) bd.scrollTop = bd.scrollHeight; await S(chars[i] === ' ' ? 10 : 22);}
      if (id === letterRun) {el.classList.remove('typing'); $('#letterSign').style.opacity = '1'; $('#skipLetter').hidden = true;}
    }
    $('#skipLetter').onclick = () => {letterRun++; $('#letterBody').scrollTop = 0; $('#letterText').classList.remove('typing'); $('#letterText').textContent = CONFIG.letter; $('#letterSign').style.opacity = '1'; $('#skipLetter').hidden = true;};
    $('#loveLoop').onclick = safe(async () => {run++; letterRun++; busy = 0; mode = 'a'; P.length = 0; openedBalloons.clear(); $('#balloonField').innerHTML = ''; $('#toTree').disabled = true; $('#toTree').classList.remove('show'); closeMemory(); resetAll(); $('.stage.active')?.classList.remove('active'); await S(400); $('#s1').classList.add('active');});

    /* ===== TREE (page 5) ===== */
    const LC = ['#6fe39a', '#4fd08a', '#9af0b4', '#ff9ecb', '#ffc2e0'];
    function buildTree() {
      const br = ['M200 305C182 296 152 286 120 252', 'M201 285C226 276 256 262 288 228', 'M199 345C176 336 148 330 108 312', 'M202 332C230 324 262 320 296 300', 'M200 262C190 232 172 212 150 178', 'M201 252C212 224 232 204 258 172', 'M200 200C196 180 200 160 200 140', 'M120 252C108 236 98 220 92 196', 'M288 228C300 212 308 196 312 172', 'M150 178C140 160 136 140 142 118', 'M258 172C266 154 270 134 262 112', 'M200 160C186 140 176 124 166 108', 'M200 150C214 132 226 116 240 102'];
      const t = $('#tree'); t.setAttribute('class', '');
      t.innerHTML = `<defs><linearGradient id="tg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a2a14"/><stop offset="1" stop-color="#9a6a3c"/></linearGradient><radialGradient id="sg"><stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#ffd36b"/></radialGradient><linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb3d9"/><stop offset="1" stop-color="#ff5fa8"/></linearGradient><radialGradient id="gr"><stop offset="0" stop-color="#2a8a62"/><stop offset="1" stop-color="#0d3030"/></radialGradient><radialGradient id="cgr"><stop offset="0" stop-color="#ff9ecb" stop-opacity=".5"/><stop offset=".6" stop-color="#6fe39a" stop-opacity=".16"/><stop offset="1" stop-color="#6fe39a" stop-opacity="0"/></radialGradient></defs>
  <ellipse cx="200" cy="404" rx="170" ry="14" fill="url(#gr)"/>
  <path d="M40 404q4-14 8 0M60 404q10-22 16 0M86 404q4-18 9 0M120 406q6-16 12 0M240 405q4-14 8 0M262 404q5-20 10 0M280 406q8-18 14 0M310 405q4-16 8 0M330 403q6-20 14 0" stroke="#2a8a62" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M98 404V390M268 404V388M148 405V394M308 404V392" stroke="#2a8a62" stroke-width="2" fill="none"/>
  <g fill="#ff9ecb"><circle cx="98" cy="388" r="4"/><circle cx="268" cy="386" r="4"/><circle cx="148" cy="392" r="3.5"/><circle cx="308" cy="390" r="3.5"/></g>
  <g fill="#ffe28a"><circle cx="98" cy="388" r="1.6"/><circle cx="268" cy="386" r="1.6"/><circle cx="148" cy="392" r="1.4"/><circle cx="308" cy="390" r="1.4"/></g>
  <ellipse id="cg" cx="200" cy="165" rx="140" ry="110" fill="url(#cgr)"/>
  <ellipse class="seedc" cx="200" cy="396" rx="7" ry="5" fill="url(#sg)"/>
  <g class="spr"><path d="M200 396V378" stroke="#6fe39a" stroke-width="3" fill="none"/><path d="M200 382q-12-2-14-12q12 0 14 12M200 380q12-2 14-12q-12 0-14 12" fill="#6fe39a"/></g>
  <g id="cn">
  <path class="tr" pathLength="1" d="M200 398C184 397 168 401 150 407" stroke="#6b4423" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M200 398C216 398 234 402 252 407" stroke="#6b4423" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M199 399C196 404 192 408 186 412" stroke="#6b4423" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M200 398C196 345 206 300 200 252C196 214 204 182 200 140" stroke="url(#tg)" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path class="tr" pathLength="1" d="M196 396C192 345 202 300 196 252C192 214 200 182 197 144" stroke="#d9a86c" stroke-width="3" fill="none" stroke-linecap="round" opacity=".45"/>`+
        br.map((d, i) => `<path class="br" pathLength="1" d="${d}" style="transition-delay:${(i * .16).toFixed(2)}s" stroke="#7a4c28" stroke-width="${Math.max(2.2, 7 - i * .45).toFixed(1)}" fill="none" stroke-linecap="round"/>`).join('') + '<g id="lv"></g><g class="hearts" id="hs"></g><path class="tstar" d="M200 108L204 119L215 122L204 125L200 136L196 125L185 122L196 119Z"/></g>';
      let L = '', Hh = ''; const nl = MOB ? 10 : 14, nh = 5;
      $$('#tree .br').forEach((b, i) => {
        const len = b.getTotalLength();
        for (let k = 0; k < nl; k++) {
          const p = b.getPointAtLength(len * (.3 + .7 * k / (nl - 1)));
          L += `<g transform="translate(${(p.x + (R() - .5) * 26) | 0} ${(p.y + (R() - .5) * 26) | 0}) rotate(${(R() * 360) | 0}) scale(${(.8 + R() * .7).toFixed(2)})"><path class="lv" d="M0 0Q7-7 15 0Q7 7 0 0Z" fill="${LC[(R() * 5) | 0]}" style="transition-delay:${(i * .22 + k * .09).toFixed(2)}s"/></g>`
        }
        for (let k = 0; k < nh; k++) {
          const p = b.getPointAtLength(len * (.4 + .6 * k / (nh - 1)));
          Hh += `<g transform="translate(${(p.x + (R() - .5) * 22) | 0} ${(p.y + (R() - .5) * 22) | 0}) rotate(${((R() - .5) * 50) | 0})"><path class="ht" d="M0 4C-10-4-6-11 0-6C6-11 10-4 0 4Z" style="--s:${(1 + R() * .8).toFixed(2)};transition-delay:${(i * .25 + k * .18).toFixed(2)}s"/></g>`
        }
      });
      $('#lv').innerHTML = L; $('#hs').innerHTML = Hh;
    }
    /* reserve the text space up front so the layout never jumps while typing */
    function reserve() {
      [['#lt', CONFIG.loveTitle(CONFIG.name)], ['#lm', CONFIG.loveMsg]].forEach(([q, tx]) => {const e = $(q); e.classList.remove('typing'); e.innerHTML = '<span class="th"></span>'; e.firstChild.textContent = tx});
      $('#ft').textContent = CONFIG.footer;
    }
    async function typeTo(el, txt, sp) {
      const a = Array.from(txt); el.innerHTML = '<span class="tv"></span><span class="th"></span>';
      const tv = el.firstChild, th = el.lastChild; el.classList.add('typing');
      for (let i = 0; i < a.length; i++) {tv.textContent = a.slice(0, i + 1).join(''); th.textContent = a.slice(i + 1).join(''); await S(sp)}
      el.classList.remove('typing'); el.textContent = txt;
    }
    async function grow() {
      const t = $('#tree'); await S(60);
      t.classList.add('seed'); await S(1300); t.classList.add('glow'); await S(1100); t.classList.add('sprout'); await S(900);
      t.classList.add('g1'); await S(2200); t.classList.add('g2'); await S(2800); t.classList.add('g3'); await S(3000); t.classList.add('g4'); await S(1800); petals = 1;
      await typeTo($('#lt'), CONFIG.loveTitle(CONFIG.name), 60); await S(300);
      await typeTo($('#lm'), CONFIG.loveMsg, 28); await S(400);
      $('#ft').classList.add('show'); await S(1200);
      const r = $('#rp'); r.disabled = false; r.classList.add('show');
    }

    /* ===== REPLAY ===== */
    function resetAll() {
      $('#gift').classList.remove('open'); $('#halo').classList.remove('on'); $('#scene').classList.remove('gone');
      $$('.flame').forEach(f => f.className = 'flame'); $$('.smoke').forEach(s => s.remove());
      $('#cakewrap').classList.remove('glow', 'blown'); $('#wish').classList.remove('show'); $('#blow').disabled = false;
      const n = $('#n2'); n.disabled = true; n.classList.remove('show');
      $('#gt').classList.remove('show'); const b = $('#b3'); b.disabled = true; b.classList.remove('show'); $('#flash').classList.remove('on');
      shine = 0; shineOn = 0; txtOn = 0; btnOn = 0; ptr = 0; galOn = 0; petals = 0; letterRun++; $('#letterText').textContent = ''; $('#letterSign').style.opacity = '0'; $('#skipLetter').hidden = false; openedBalloons.clear(); $('#balloonField').innerHTML = ''; $('#toTree').disabled = true; $('#toTree').classList.remove('show');
      reserve(); $('#ft').classList.remove('show');
      const r = $('#rp'); r.disabled = true; r.classList.remove('show'); buildTree();
    }
    $('#rp').onclick = safe(async () => {$('#rp').disabled = true; await go(6);});

    /* ===== INIT ===== */
    fillText(); reserve(); sprinkles(); resize(); buildTree(); addEventListener('resize', resize);
    requestAnimationFrame(loop);
  </script>
</body>
